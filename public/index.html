<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236366f1'/%3E%3Cpath d='M13 3 5 14h6l-1 7 8-11h-6l1-7z' fill='%23fff'/%3E%3C/svg%3E">
<title>清枢智汇 · 多账号面板</title>
<style>
  :root{
    --ink:#1e1b3a;
    --ink-2:#5b5779;
    --ink-3:#8d89a8;
    --card:rgba(255,255,255,.74);
    --card-border:rgba(255,255,255,.9);
    --accent:#6366f1;
    --accent-2:#8b5cf6;
    --good:#10b981;
    --warn:#f59e0b;
    --bad:#ef4444;
    --shadow:0 10px 40px rgba(99,102,241,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",serif;
    background:linear-gradient(135deg,#eef1ff 0%,#f6f3ff 48%,#edf6ff 100%);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  .glow{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none;z-index:0}
  .g1{width:520px;height:520px;background:#c7d2fe;top:-180px;left:-140px}
  .g2{width:460px;height:460px;background:#ddd6fe;bottom:-200px;right:-120px}
  .g3{width:300px;height:300px;background:#bae6fd;top:40%;right:26%;opacity:.35}

  .wrap{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding:34px 22px 60px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:26px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 8px 22px rgba(99,102,241,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .logo svg{width:24px;height:24px}
  h1{font-size:21px;font-weight:700;letter-spacing:.3px}
  .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .updated{font-size:12.5px;color:var(--ink-3)}
  .btn{
    display:inline-flex;align-items:center;gap:7px;border:none;cursor:pointer;
    font-family:inherit;font-size:13.5px;font-weight:600;color:#fff;
    padding:10px 18px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 6px 18px rgba(99,102,241,.32);
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(99,102,241,.4)}
  .btn:active{transform:translateY(0)}
  .btn[disabled]{opacity:.55;cursor:default;transform:none}
  .btn svg{width:15px;height:15px}
  .btn.spin svg{animation:rot 1s linear infinite}
  .btn.ghost{
    color:var(--accent);background:rgba(255,255,255,.88);
    border:1px solid rgba(99,102,241,.28);box-shadow:0 4px 14px rgba(99,102,241,.14);
  }
  .btn.ghost:hover{background:var(--accent);color:#fff}
  .btn.sm{padding:6px 12px;font-size:12.5px;border-radius:9px;box-shadow:0 2px 8px rgba(99,102,241,.18)}
  @keyframes rot{to{transform:rotate(360deg)}}

  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}}
  .s-card{
    background:var(--card);border:1px solid var(--card-border);border-radius:18px;
    padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .s-label{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
  .s-value{font-size:26px;font-weight:750;margin-top:7px;letter-spacing:.3px;font-variant-numeric:tabular-nums}
  .s-value .unit{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:4px}
  .s-note{font-size:12px;color:var(--ink-3);margin-top:5px}
  .s-note b{color:var(--accent);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{
    background:var(--card);border:1px solid var(--card-border);border-radius:22px;
    padding:22px 24px 20px;box-shadow:var(--shadow);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    position:relative;overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(99,102,241,.16)}
  .card::before{
    content:"";position:absolute;inset:0 0 auto 0;height:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2),#22d3ee);opacity:.85;
  }
  .card.err::before{background:linear-gradient(90deg,#f87171,#ef4444)}
  .c-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .c-name{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
  .c-name .edit-name{
    border:none;background:rgba(99,102,241,.1);color:var(--accent);cursor:pointer;
    width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .c-name .edit-name:hover{background:var(--accent);color:#fff}
  .c-name .edit-name svg{width:12px;height:12px}
  .c-head-right{display:flex;align-items:center;gap:8px}
  .c-del{
    border:none;background:rgba(239,68,68,.08);color:#d9534f;cursor:pointer;
    width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;opacity:0;
  }
  .card:hover .c-del{opacity:1}
  .c-del:hover{background:var(--bad);color:#fff}
  .c-del svg{width:13px;height:13px}
  .c-phone{font-size:13px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px}
  .status.ok{color:#067a58;background:rgba(16,185,129,.13)}
  .status.limited{color:#92510a;background:rgba(245,158,11,.15)}
  .status.err{color:#b91c1c;background:rgba(239,68,68,.13)}
  .dot{width:7px;height:7px;border-radius:50%;background:currentColor}

  .eye{
    border:none;background:none;color:var(--ink-3);cursor:pointer;flex:none;
    width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;
  }
  .eye:hover{background:rgba(99,102,241,.12);color:var(--accent)}
  .eye svg{width:14px;height:14px}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .m{border-radius:14px;padding:13px 15px;background:rgba(238,240,255,.66)}
  .m .k{font-size:12px;color:var(--ink-3)}
  .m .v{font-size:21px;font-weight:750;margin-top:5px;font-variant-numeric:tabular-nums}
  .m .v .unit{font-size:12px;font-weight:600;color:var(--ink-3);margin-left:3px}
  .m .v small{font-size:12px;font-weight:600;color:var(--ink-3)}
  .m .sub2{font-size:11.5px;color:var(--ink-3);margin-top:4px}
  .m .sub2 b{color:var(--accent);font-weight:650}
  .m .sub2 .over{color:var(--warn);font-weight:650}

  .limit{margin-top:14px}
  .limit .row{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .limit .row b{color:var(--ink-2);font-weight:650}
  .bar{height:8px;border-radius:999px;background:rgba(99,102,241,.13);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .5s ease}
  .bar.full i{background:linear-gradient(90deg,#f59e0b,#f97316)}

  /* API Keys 区 */
  .keys-sec{margin-top:16px;border-top:1px dashed rgba(99,102,241,.22);padding-top:13px}
  .keys-title{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.8px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}
  .krow{
    display:flex;align-items:center;gap:7px;margin-bottom:7px;
    background:rgba(255,255,255,.66);border:1px solid rgba(99,102,241,.13);
    border-radius:10px;padding:7px 9px;
  }
  .krow .ktag{
    flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;
  }
  .ktag.metered{color:#1d4ed8;background:rgba(59,130,246,.12)}
  .ktag.subscription{color:#7c3aed;background:rgba(139,92,246,.13)}
  .krow .kval{
    flex:1;min-width:0;font-family:Consolas,Menlo,monospace;font-size:12px;color:var(--ink-2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;
  }
  .krow .kval.none{color:var(--ink-3);font-family:inherit;font-style:italic}
  .krow .kbtn{
    flex:none;border:none;background:none;color:var(--ink-3);cursor:pointer;
    min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:11px;font-weight:650;
    display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
  }
  .krow .kbtn:hover{background:rgba(99,102,241,.12);color:var(--accent)}
  .krow .kbtn svg{width:13px;height:13px}
  .krow .kbtn.warn:hover{background:rgba(245,158,11,.16);color:#b45309}
  .krow .kbtn.danger:hover{background:rgba(239,68,68,.13);color:var(--bad)}

  .linkrow{display:flex;gap:8px;margin-top:12px}
  .linkrow input{
    flex:1;min-width:0;font-family:Consolas,Menlo,monospace;font-size:12px;color:var(--ink-2);
    background:rgba(255,255,255,.85);border:1px solid rgba(99,102,241,.18);
    border-radius:11px;padding:9px 12px;outline:none;
  }
  .copy{
    flex:none;border:1px solid rgba(99,102,241,.28);background:rgba(255,255,255,.9);color:var(--accent);
    font-family:inherit;font-size:12.5px;font-weight:650;border-radius:11px;padding:9px 15px;cursor:pointer;
    transition:background .15s,color .15s;
  }
  .copy:hover{background:var(--accent);color:#fff}
  .errbox{margin-top:16px;font-size:13px;color:#b91c1c;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);border-radius:12px;padding:12px 14px;word-break:break-all}

  footer{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--ink-3);padding:0 20px 30px}

  /* 弹窗 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(30,27,58,.32);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal-mask.open{display:flex}
  .modal{
    width:100%;max-width:420px;background:#fff;border-radius:20px;box-shadow:0 24px 80px rgba(30,27,58,.3);
    padding:24px 26px 22px;position:relative;animation:pop .2s ease;
  }
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h3{font-size:16.5px;font-weight:750;margin-bottom:4px}
  .modal .m-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:16px;line-height:1.55}
  .modal label{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin:12px 0 6px}
  .modal input,.modal textarea{
    width:100%;font-family:inherit;font-size:13.5px;color:var(--ink);
    border:1px solid rgba(99,102,241,.24);border-radius:11px;padding:10px 13px;outline:none;
    transition:border-color .15s, box-shadow .15s;background:#fbfbff;
  }
  .modal textarea{font-family:Consolas,Menlo,monospace;font-size:12.5px;resize:vertical;min-height:64px}
  .modal input:focus,.modal textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.14)}
  .modal .m-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .modal .m-hint{font-size:11.5px;color:var(--ink-3);margin-top:8px;line-height:1.5}
  .modal .m-hint.warn{color:#b45309;background:rgba(245,158,11,.1);border-radius:9px;padding:8px 10px}
  .modal .m-err{display:none;font-size:12.5px;color:#b91c1c;background:rgba(239,68,68,.08);border-radius:9px;padding:8px 10px;margin-top:10px}
  .modal .m-err.show{display:block}
  .btn.plain{background:rgba(99,102,241,.1);color:var(--accent);box-shadow:none}
  .btn.plain:hover{background:rgba(99,102,241,.18)}
  .btn.danger{background:linear-gradient(135deg,#f87171,#ef4444);box-shadow:0 6px 18px rgba(239,68,68,.3)}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:rgba(30,27,58,.9);color:#fff;font-size:13px;padding:10px 20px;border-radius:12px;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;backdrop-filter:blur(8px);
    max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/>
        </svg>
      </div>
      <div>
        <h1>清枢智汇 · 多账号面板</h1>
        <div class="sub">tierflow.cn 推广与余额总览 · 单账号每日 5 人计奖励，超出不计入</div>
      </div>
    </div>
    <div class="toolbar">
      <span class="updated" id="updated">正在加载…</span>
      <button class="btn ghost sm" id="toggleall">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="tl-label">全部显示</span>
      </button>
      <button class="btn ghost sm" id="addacc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        添加账号
      </button>
      <button class="btn ghost sm" id="copyall">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        复制全部链接
      </button>
      <button class="btn ghost sm" id="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        设置
      </button>
      <button class="btn sm" id="refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        刷新
      </button>
    </div>
  </header>

  <section class="summary" id="summary"></section>
  <section class="grid" id="grid"></section>
</div>

<footer>面板每 5 分钟自动刷新 · 数据来源：tierflow.cn API · 数据仅保存在本机</footer>

<div class="modal-mask" id="modal-mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var fmtY = function(n){ return (Math.round(Number(n||0)*100)/100).toFixed(2); };
  var fmtTime = function(ts){
    var d = new Date(ts);
    var p = function(x){ return x<10?'0'+x:''+x; };
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  };
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var maskPhone = function(p){ p=String(p||''); return p.length===11 ? p.slice(0,3)+'****'+p.slice(-4) : p; };
  var maskKey = function(k){ k=String(k||''); return k.length>12 ? k.slice(0,7)+'••••••••'+k.slice(-4) : k; };
  var maskLink = function(u){
    u=String(u||'');
    var m=u.match(/^(.*referral_code=)([A-Za-z0-9]+)$/);
    if(m && m[2].length>5) return m[1]+m[2].slice(0,4)+'••••••';
    return u;
  };

  var toastTimer = null;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function copyText(text, okMsg){
    function done(){ toast(okMsg); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done, function(){ fallback(); });
    } else { fallback(); }
    function fallback(){
      var t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选择'); }
      document.body.removeChild(t);
    }
  }

  // 显隐状态（跨刷新保持）
  var reveal = {};
  // 默认全部隐藏
  function rv(id){ return !!reveal[id]; }
  function toggleRv(id){ reveal[id] = !reveal[id]; }

  function eyeBtn(id, label){
    var shown = rv(id);
    var icon = shown
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
    return '<button class="eye" data-rv="'+esc(id)+'" title="'+(shown?'隐藏':'显示')+'" aria-label="'+(shown?'隐藏':'显示')+label+'">'+icon+'</button>';
  }

  // ---------- 渲染 ----------
  function renderSummary(s){
    var cards = [
      { label:'账号总数', value: s.accountCount, unit:'个', note: '正常 <b>'+s.okCount+'</b> 个' },
      { label:'总余额', value: '¥'+fmtY(s.totalBalanceYuan), note: '全部账号可用额度合计' },
      { label:'今日推广', value: s.todayRewarded + s.todayFailed, unit:'人', note: '计奖 <b>'+s.todayRewarded+'</b> · 超限未计 <b>'+s.todayFailed+'</b>' },
      { label:'累计成功邀请', value: s.totalInvites, unit:'人', note: '累计奖励 <b>¥'+fmtY(s.totalRewardYuan)+'</b>' }
    ];
    $('summary').innerHTML = cards.map(function(c){
      return '<div class="s-card"><div class="s-label">'+c.label+'</div>'+

        '<div class="s-note">'+c.note+'</div></div>';

  function keyRow(a, kind){
    var kindName = kind === 'metered' ? '按量' : '套餐';
    var tagCls = kind;
    var saved = a.keys && a.keys[kind];
    var rvId = 'key:'+a.phone+':'+kind;
    var shown = rv(rvId);
    var valHtml, btns;
    if(saved){
      var shownVal = shown ? saved.key : maskKey(saved.key);
      valHtml = '<span class="kval" title="'+(shown?'':'点击小眼睛查看完整 key')+'">'+esc(shownVal)+'</span>';
      btns = eyeBtn(rvId, kindName+' Key') +
        '<button class="kbtn" data-act="copykey" data-phone="'+esc(a.phone)+'" data-kind="'+kind+'" title="复制完整 key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>' +
        '<button class="kbtn" data-act="editkey" data-phone="'+esc(a.phone)+'" data-kind="'+kind+'" title="手动编辑">✎</button>' +
        '<button class="kbtn warn" data-act="regenkey" data-phone="'+esc(a.phone)+'" data-kind="'+kind+'" title="'+(kind==='metered'?'从平台新建一把按量 Key':'从平台重置套餐 Key（旧 key 立即失效）')+'">↻</button>';
    } else {
      valHtml = '<span class="kval none">未保存明文'+(a.tokens&&a.tokens.length&&kind==='metered'?'（平台打码值 '+esc((a.tokens[0]||{}).maskedKey||'')+'）':(a.subKey&&kind==='subscription'?'（平台打码值 '+esc(a.subKey.maskedKey||'')+'）':''))+'</span>';
      btns = '<button class="kbtn" data-act="pastekey" data-phone="'+esc(a.phone)+'" data-kind="'+kind+'" title="粘贴保存">✎</button>' +
        '<button class="kbtn" data-act="regenkey" data-phone="'+esc(a.phone)+'" data-kind="'+kind+'" title="'+(kind==='metered'?'从平台新建按量 Key':'从平台签发套餐 Key')+'">＋ '+(kind==='metered'?'新建':'签发')+'</button>';
    }
    return '<div class="krow"><span class="ktag '+tagCls+'">'+kindName+'</span>'+valHtml+btns+'</div>';
  }

    var phoneRvId = 'phone:'+a.phone;

        '</div>'+

          '<button class="eye" data-rv="'+esc(phoneRvId)+'" title="'+(phoneShown?'隐藏手机号':'显示手机号')+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(phoneShown?'<path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 10 8 10 8a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s3 8 10 8a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>':'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>')+'</svg></button>'+
        '</div></div>'+
      '<div class="c-head-right">'+statusHtml+
        '<button class="c-del" data-act="delacc" data-phone="'+esc(a.phone)+'" title="删除账号"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button></div></div>'+
      '<div class="metrics">'+
        '<div class="m"><div class="k">余额</div><div class="v">¥'+fmtY(a.balanceYuan)+'<small> 元</small></div>'+expiring+'</div>'+
        '<div class="m"><div class="k">今日推广</div><div class="v">'+todayTotal+'<span class="unit">人</span></div>'+
          '<div class="sub2">计奖 <b>'+a.todayRewarded+'</b> · 未计 <span class="'+(a.todayFailed>0?'over':'')+'">'+a.todayFailed+'</span></div></div>'+

        '<div class="m"><div class="k">累计奖励</div><div class="v">¥'+fmtY(a.totalRewardYuan)+'<small> 元</small></div>'+
          '<div class="sub2">已用额度 ¥'+fmtY(a.usedYuan)+'</div></div>'+

      '<div class="keys-sec">'+
        '<div class="keys-title"><span>API KEYS</span><span>'+(a.keys&&(a.keys.metered||a.keys.subscription)?'已保存 · '+esc((a.keys.metered?a.keys.metered.source||'':''))+(a.keys.metered&&a.keys.subscription?' / ':'' )+(a.keys.subscription?(a.keys.subscription.source||''):''):'')+'</span></div>'+

  function render(data){
    renderSummary(data.summary);
    $('grid').innerHTML = data.accounts.map(renderCard).join('');
    $('updated').textContent = '最后更新 ' + fmtTime(data.updatedAt);
  }

  // ---------- 数据加载 ----------
  var busy = false;
  var lastData = null;
  var refreshMs = 300000;
  function load(force){
    if(busy) return; busy = true;
    var btn = $('refresh'); btn.classList.add('spin'); btn.disabled = true;
    fetch(force ? '/api/refresh' : '/api/data', { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){
        lastData = data;
        if(data.refreshIntervalMs) refreshMs = data.refreshIntervalMs;
        render(data);      })
      .catch(function(e){ $('updated').textContent = '加载失败：'+e.message; })
      .then(function(){ busy = false; btn.classList.remove('spin'); btn.disabled = false; });
  }
  function schedule(){ setTimeout(function(){ load(false); schedule(); }, refreshMs); }

  // ---------- 弹窗 ----------
  var modalMask = $('modal-mask');
  var modalBox = $('modal');
  function closeModal(){ modalMask.classList.remove('open'); modalBox.innerHTML=''; }
  modalMask.addEventListener('click', function(e){ if(e.target===modalMask) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  function openModal(html){ modalBox.innerHTML = html; modalMask.classList.add('open'); var f=modalBox.querySelector('input,textarea'); if(f) setTimeout(function(){f.focus();},50); }
  function modalErr(msg){ var el=modalBox.querySelector('.m-err'); if(el){ el.textContent=msg; el.classList.add('show'); } }

  function accountByPhone(ph){
    if(!lastData) return null;
    return lastData.accounts.filter(function(a){ return a.phone===ph; })[0] || null;
  }

  // 重命名
  function uiRename(phone, label){
    openModal(
      '<h3>重命名账号</h3><div class="m-sub">给 '+esc(maskPhone(phone))+' 起一个自己好记的名字</div>'+
      '<label>名称</label><input id="m-input" value="'+esc(label)+'" maxlength="30">'+
      '<div class="m-err"></div>'+
      '<div class="m-actions"><button class="btn plain" data-m="cancel">取消</button><button class="btn" data-m="ok">保存</button></div>'
    );
    modalBox.querySelector('[data-m="ok"]').onclick = function(){
      var v = modalBox.querySelector('#m-input').value.trim();
      if(!v){ modalErr('名称不能为空'); return; }
      this.disabled = true;
      fetch('/api/accounts/'+encodeURIComponent(phone)+'/label', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({label:v}) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.success) throw new Error(j.error||'失败');
          closeModal(); toast('已重命名'); load(true);
        })
        .catch(function(e){ modalErr(e.message); this.disabled=false; }.bind(this));
    };
    modalBox.querySelector('[data-m="cancel"]').onclick = closeModal;
  }

  // 编辑/粘贴 key
  function uiEditKey(phone, kind, currentKey){
    var kindName = kind==='metered'?'按量':'套餐';
    openModal(
      '<h3>编辑'+kindName+' Key</h3><div class="m-sub">'+esc(maskPhone(phone))+' · 粘贴或修改完整 key（sk- 开头）。留空保存=从面板中清除该记录（不影响平台）。</div>'+
      '<label>Key</label><textarea id="m-key" placeholder="sk-..." spellcheck="false">'+esc(currentKey||'')+'</textarea>'+
      '<div class="m-err"></div>'+
      '<div class="m-actions"><button class="btn plain" data-m="cancel">取消</button><button class="btn" data-m="ok">保存</button></div>'
    );
    modalBox.querySelector('[data-m="ok"]').onclick = function(){
      var v = modalBox.querySelector('#m-key').value.trim();
      this.disabled = true;
      fetch('/api/accounts/'+encodeURIComponent(phone)+'/keys/'+kind, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({key:v}) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.success) throw new Error(j.error||'失败');
          closeModal(); toast(v?('已保存'+kindName+' Key'):('已清除'+kindName+' Key 记录')); load(true);
        })
        .catch(function(e){ modalErr(e.message); this.disabled=false; }.bind(this));
    };
    modalBox.querySelector('[data-m="cancel"]').onclick = closeModal;
  }

  // 从平台创建
  function uiGenKey(phone, kind, hasOld){
    var kindName = kind==='metered'?'按量':'套餐';
    var warn = kind==='subscription'
      ? '<div class="m-hint warn">⚠ 套餐 Key 重置后，<b>旧 key 立即失效</b>。如果旧 key 已在别处使用，请先确认再重置。</div>'
      : '<div class="m-hint">将创建一把<b>新的</b>按量 Key（已存在的旧 token 不受影响，依然有效）。</div>';
    openModal(
      '<h3>从平台'+(hasOld?'重新生成':'创建')+kindName+' Key</h3><div class="m-sub">'+esc(maskPhone(phone))+'<br>平台仅在创建时返回一次完整 key，面板会立即捕获并保存。</div>'+
      warn+
      '<div class="m-err"></div>'+
      '<div class="m-actions"><button class="btn plain" data-m="cancel">取消</button><button class="btn '+(kind==='subscription'&&hasOld?'danger':'')+'" data-m="ok">'+(kind==='subscription'&&hasOld?'确认重置':'确认'+(hasOld?'':'创建'))+'</button></div>'
    );
    modalBox.querySelector('[data-m="ok"]').onclick = function(){
      this.disabled = true;
      fetch('/api/accounts/'+encodeURIComponent(phone)+'/keys/'+kind+'/create', { method:'POST' })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.success) throw new Error(j.error||'失败');
          closeModal();
          toast(kindName+' Key 已生成并保存');
          load(true);
        })
        .catch(function(e){ modalErr(e.message); this.disabled=false; }.bind(this));
    };
    modalBox.querySelector('[data-m="cancel"]').onclick = closeModal;

  function uiAddAccount(){
    openModal(
      '<h3>添加账号</h3><div class="m-sub">将真实登录校验通过后加入面板。key 可之后在卡片上创建或粘贴。</div>'+
      '<label>手机号</label><input id="m-phone" placeholder="11 位手机号" inputmode="numeric">'+

        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j.success) throw new Error(j.error||'失败');
          closeModal(); toast('已添加 '+maskPhone(j.phone)); load(true);

        .catch(function(e){ modalErr(e.message); this.disabled=false; }.bind(this));

  // 设置（访问密码开关 + 账号密码）
  function uiSettings(){
    fetch('/api/settings', { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(s){
        var on = !!s.requireAuth;
        openModal(
          '<h3>设置</h3><div class="m-sub">默认谁打开地址都能看。要给局域网/公网访问加一道门，就开启下面的开关。</div>'+
          '<label style="display:flex;align-items:center;gap:8px;cursor:pointer">'+
            '<input type="checkbox" id="m-req" style="width:auto;margin:0" '+(on?'checked':'')+'> 开启访问密码（本机访问仍免密）</label>'+
          '<div id="m-authbox" style="display:'+(on?'block':'none')+'">'+
            '<label>用户名</label><input id="m-user" value="'+esc(s.authUser||'admin')+'" maxlength="40">'+
            '<label>密码'+(s.hasPassword?'（留空 = 不修改）':'')+'</label><input id="m-pass" type="password" placeholder="'+(s.hasPassword?'已设置，留空不修改':'设置一个密码')+'">'+
          '</div>'+
          '<div class="m-hint">本机（这台电脑）打开永远免密，不用输密码。密码错 3 次会临时封 IP。</div>'+
          '<div class="m-err"></div>'+
          '<div class="m-actions"><button class="btn plain" data-m="cancel">取消</button><button class="btn" data-m="ok">保存</button></div>'
        );
        var reqEl = modalBox.querySelector('#m-req');
        var boxEl = modalBox.querySelector('#m-authbox');
        reqEl.onchange = function(){ boxEl.style.display = reqEl.checked ? 'block' : 'none'; };
        modalBox.querySelector('[data-m="ok"]').onclick = function(){
          var body = { requireAuth: reqEl.checked, authUser: modalBox.querySelector('#m-user').value.trim() };
          var pw = modalBox.querySelector('#m-pass').value;
          if(pw) body.authPass = pw;
          if(reqEl.checked && !pw && !s.hasPassword){ modalErr('开启访问密码前，请先设置密码'); return; }
          this.disabled = true;
          fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
            .then(function(r){ return r.json(); })
            .then(function(j){
              if(!j.success) throw new Error(j.error||'失败');
              closeModal();
              toast(j.requireAuth ? '已开启访问密码' : '已关闭访问密码');
            })
            .catch(function(e){ modalErr(e.message); this.disabled=false; }.bind(this));
        };
        modalBox.querySelector('[data-m="cancel"]').onclick = closeModal;
      })
      .catch(function(e){ toast('读取设置失败：'+e.message); });
  }

  // ---------- 事件委托 ----------
  document.addEventListener('click', function(e){
    var eye = e.target.closest('.eye');
    if(eye){
      var id = eye.getAttribute('data-rv');
      toggleRv(id);
      if(lastData) render(lastData);
      return;
    }
    var btn = e.target.closest('[data-act]');
    if(!btn) return;
    var act = btn.getAttribute('data-act');
    var phone = btn.getAttribute('data-phone');
    var a = phone ? accountByPhone(phone) : null;
    if(act==='renacc'){ uiRename(phone, btn.getAttribute('data-label')||''); }
    else if(act==='delacc'){ uiDelAccount(phone, a?a.label:phone); }
    else if(act==='editkey' || act==='pastekey'){
      var kind = btn.getAttribute('data-kind');
      var cur = (a && a.keys && a.keys[kind]) ? a.keys[kind].key : '';
      uiEditKey(phone, kind, cur);
    }
    else if(act==='regenkey'){
      var k2 = btn.getAttribute('data-kind');
      var hasOld = !!(a && a.keys && a.keys[k2]);
      uiGenKey(phone, k2, hasOld);
    }
    else if(act==='copykey'){
      var k3 = btn.getAttribute('data-kind');
      var v = (a && a.keys && a.keys[k3]) ? a.keys[k3].key : '';
      if(v) copyText(v, 'Key 已复制'); else toast('没有可复制的 key');
    }
    else if(act==='copylink'){
      if(a && a.referralLink) copyText(a.referralLink, '推广链接已复制'); else toast('暂无链接');
    }
    else if(act==='selectlink'){
      btn.select && btn.select();
    }
  });

  $('toggleall').addEventListener('click', function(){
    var anyHidden = !lastData || lastData.accounts.some(function(a){
      return !rv('phone:'+a.phone) || !rv('link:'+a.phone) ||
        (a.keys&&a.keys.metered&&!rv('key:'+a.phone+':metered')) ||
        (a.keys&&a.keys.subscription&&!rv('key:'+a.phone+':subscription'));
    });
    var target = anyHidden; // 有隐藏的→全部显示；否则全部隐藏
    if(lastData) lastData.accounts.forEach(function(a){
      reveal['phone:'+a.phone] = target;
      reveal['link:'+a.phone] = target;
      reveal['key:'+a.phone+':metered'] = target;
      reveal['key:'+a.phone+':subscription'] = target;
    });
    var label = this.querySelector('.tl-label');
    if(label) label.textContent = target ? '全部隐藏' : '全部显示';
    if(lastData) render(lastData);
  });

  $('addacc').addEventListener('click', uiAddAccount);
  $('settings').addEventListener('click', uiSettings);
  $('copyall').addEventListener('click', function(){
    if(!lastData){ toast('数据未加载'); return; }
    var links = lastData.accounts.filter(function(a){ return a.referralLink; }).map(function(a){
      return a.label + '：' + a.referralLink;
    }).join('\n');
    if(!links){ toast('暂无可用链接'); return; }
    copyText(links, '已复制 ' + lastData.accounts.filter(function(a){ return a.referralLink; }).length + ' 条推广链接');
  });
  $('refresh').addEventListener('click', function(){ load(true); });
  load(false);
  schedule();
})();
</script>
</body>
</html>
